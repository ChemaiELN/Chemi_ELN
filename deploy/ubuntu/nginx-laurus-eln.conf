# ==============================================================
#  Laurus ELN — nginx site
#  Deployed to /etc/nginx/sites-available/laurus-eln
#
#  Serves the built React app and reverse-proxies /api to the Node
#  backend on 127.0.0.1:8000. Single origin => no CORS, and only
#  port 80 needs to be open on the server.
# ==============================================================

upstream laurus_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.205.247 _;

    root /var/www/laurus-eln;
    index index.html;

    # Uploads are capped at 50 MB by MAX_UPLOAD_BYTES; leave headroom
    # for multipart overhead so the backend produces the error, not nginx.
    client_max_body_size 60m;

    access_log /var/log/nginx/laurus-eln.access.log;
    error_log  /var/log/nginx/laurus-eln.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # ── Server-Sent Events ────────────────────────────────────
    # Must precede /api/. EventSource needs unbuffered, long-lived
    # responses; with default buffering the browser receives nothing
    # and live notification refresh silently stops working.
    location /api/sse/ {
        proxy_pass http://laurus_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # Keep the stream open; the client reconnects on its own.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ── API ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://laurus_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # PDF/report generation and large uploads can be slow.
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # Streamed downloads (res.download) shouldn't be buffered to disk first.
        proxy_buffering off;
    }

    # ── Runtime config ────────────────────────────────────────
    # Never cache: this file carries API_URL and is edited in place on
    # the server. A cached copy would pin browsers to a stale backend.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # ── Static assets ─────────────────────────────────────────
    # Vite fingerprints these filenames, so they're safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────
    # Client-side routes (/adc/projects, /admin/users, …) have no file
    # on disk; hand them index.html so a deep link / refresh works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
